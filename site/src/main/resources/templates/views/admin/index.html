<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Movie Booking</title>
    <th:block th:replace="~{fragments/general-admin :: admin-head-resources}"></th:block>
</head>
<body>
<div class="admin-container">
    <div th:replace="~{fragments/general-admin :: admin-menu}"></div>

    <main class="main-content">
        <header>
            <h1>Dashboard</h1>
        </header>

        <section class="stats">
            <div class="card">
                <h3>Total Users</h3>
                <p th:text="${#numbers.formatInteger(dashboard.totalUsers, 1, 'POINT')}">0</p>
            </div>
            <div class="card">
                <h3>Total Bookings</h3>
                <p th:text="${#numbers.formatInteger(dashboard.totalBookings, 1, 'POINT')}">0</p>
            </div>
            <div class="card">
                <h3>Revenue</h3>
                <p th:text="|${#numbers.formatInteger(dashboard.revenue, 1, 'POINT')} ₫|">0 ₫</p>
            </div>
        </section>

        <section class="table-section">
            <h2>Latest Bookings</h2>
            <table>
                <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>User</th>
                    <th>Movie</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(dashboard.latestBookings)}">
                    <td colspan="6" class="text-center text-muted">No bookings yet</td>
                </tr>
                <tr th:each="booking : ${dashboard.latestBookings}">
                    <td th:text="${booking.bookingId}"></td>
                    <td th:text="${booking.userEmail}"></td>
                    <td th:text="${booking.movieTitle}"></td>
                    <td th:text="${#temporals.format(booking.bookedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="|${#numbers.formatInteger(booking.totalPrice, 1, 'POINT')} ₫|"></td>
                    <td th:text="${booking.status}"></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
